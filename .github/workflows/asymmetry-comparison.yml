name: Paired asymmetry diagnostic
on:
  push:
    branches: [research/oscillation-generalization]
    paths:
      - 'benchmarks/autoencoder/asymmetry_comparison.py'
      - '.github/workflows/asymmetry-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . scipy scikit-learn bycycle==1.2.0
      - working-directory: benchmarks/autoencoder
        run: python -u asymmetry_comparison.py --out results_asymmetry
      - if: always()
        run: |
          mkdir -p benchmarks/autoencoder/results_asymmetry
          python -m pip freeze > benchmarks/autoencoder/results_asymmetry/requirements-resolved.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-asymmetry-results
          path: benchmarks/autoencoder/results_asymmetry/
