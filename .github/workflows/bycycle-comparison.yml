name: Bycycle comparison - Experiment B
on:
  push:
    branches: [research/bycycle-comparison]
    paths:
      - 'benchmarks/autoencoder/**'
      - '.github/workflows/bycycle-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e . pytest scipy scikit-learn bycycle==1.2.0
      - name: Validate existing pipeline
        working-directory: benchmarks/autoencoder
        run: python -m pytest -v test_data.py matching.py
      - name: Run independent comparison
        working-directory: benchmarks/autoencoder
        run: python -u bycycle_comparison.py --out results_bycycle
      - name: Record dependencies
        if: always()
        run: |
          mkdir -p benchmarks/autoencoder/results_bycycle
          python -m pip freeze > benchmarks/autoencoder/results_bycycle/requirements-resolved.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bycycle-comparison-results
          path: benchmarks/autoencoder/results_bycycle/
