name: Refined extrema tests
on:
  push:
    branches: [enhancement/refined-extrema]
  pull_request:
    paths:
      - 'src/featuregraph_core/**'
      - 'tests/test_refined_extrema.py'
      - '.github/workflows/refined-extrema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests
