name: Refinement research equivalence
on:
  push:
    branches: [enhancement/refined-extrema]
    paths:
      - 'benchmarks/refinement_confirmation/**'
      - 'src/featuregraph_core/**'
      - '.github/workflows/refinement-confirmation.yml'
  pull_request:
    paths:
      - 'benchmarks/refinement_confirmation/**'
      - 'src/featuregraph_core/**'
      - '.github/workflows/refinement-confirmation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen research dependencies and package
        run: python -m pip install -e . numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Check cycle measurements and archived scores
        run: python -u benchmarks/refinement_confirmation/verify.py --out results_refinement_confirmation
      - name: Record dependency versions
        if: always()
        run: |
          mkdir -p results_refinement_confirmation
          python -m pip freeze > results_refinement_confirmation/requirements-resolved.txt
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-refinement-confirmation
          path: results_refinement_confirmation/
